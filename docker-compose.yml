services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      # Keep the dependencies installed into the image: the bind mount above
      # would otherwise hide them, and vendor/ is not committed.
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy
    environment:
      # Defaults so `docker compose up` works on a clean checkout with no .env
      # file. Anything set in .env overrides these.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-wallet}
      DB_USERNAME: ${DB_USERNAME:-root1}
      DB_PASSWORD: ${DB_PASSWORD:-0123}

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wallet}
      MYSQL_USER: ${DB_USERNAME:-root1}
      MYSQL_PASSWORD: ${DB_PASSWORD:-0123}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-0123}
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: mysql:8
    environment:
      MYSQL_DATABASE: wallet_test
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
